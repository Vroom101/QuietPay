# Render blueprint for the relayer. Secrets are set in the Render dashboard, never here.
services:
  - type: web
    name: quietpay-relayer
    runtime: docker
    dockerfilePath: ./packages/relayer/Dockerfile
    dockerContext: .
    healthCheckPath: /v1/health
    disk: { name: data, mountPath: /data, sizeGB: 1 }
    envVars:
      - { key: CHAIN_ID, value: "1874" }
      - { key: RPC_URL, value: https://rpc.testnet.whitechain.io }
      - { key: USDT_ADDRESS, value: "0xcedfB56113143d55b2358b8CFbB0dEB5Ad2f55a7" }
      - { key: DATABASE_PATH, value: /data/quietpay.db }
      - { key: ROUTER_ADDRESS, sync: false }
      - { key: RELAYER_PRIVATE_KEY, sync: false }
      - { key: OPERATOR_TOKEN, sync: false }
      - { key: MERCHANT_API_KEYS, sync: false }
      - { key: WEBHOOK_SECRET, sync: false }
      - { key: LOSS_BUDGET_WBT_PER_HOUR, value: "0.05" }
      - { key: PAYER_CAP_USDT, value: "100" }
      # Render terminates TLS in one proxy hop; without this every client shares one rate-limit key.
      - { key: TRUST_PROXY_HOPS, value: "1" }
      - { key: MAX_GAS_PRICE, sync: false }
      - { key: EXPLORER_BASE_URL, sync: false }
      # Names added to match docs/b/build/config-matrix.md (defaults shown; change only on purpose).
      - { key: ALLOW_PRIVATE_WEBHOOKS, value: "0" }
      - { key: SETTLE_CONFIRMATIONS, value: "1" }
      - { key: RELAY_FEE_USDT, value: "0.05" }
      - { key: RATE_LIMIT_PER_MINUTE, value: "20" }
      - { key: ORDERS_PER_MINUTE_PER_MERCHANT, value: "1200" }
      - { key: TOKEN_DOMAIN_NAME, value: "Tether USD" }
      - { key: TOKEN_DOMAIN_VERSION, value: "1" }
      - { key: PORT, value: "8787" }
      - { key: MIN_VALID_SECONDS, value: "60" }
      - { key: REVERTED_PAYER_MIN_VALID_SECONDS, value: "120" }
      - { key: MAX_REVERTS_PER_DAY, value: "2" }
      - { key: PAYER_LOSS_SHARE_PERCENT, value: "25" }
      - { key: TX_MAX_AGE_SECONDS, value: "1800" }
      - { key: FIRST_TIME_PAYER_LOSS_SHARE_PERCENT, value: "5" }
      - { key: FIRST_TIME_PAYER_LOSS_CAP_PERCENT, value: "100" }
      - { key: MAX_NEW_PAYERS_PER_IP_PER_HOUR, value: "10" }
      - { key: RECONCILE_INTERVAL_SECONDS, value: "30" }
      - { key: CORS_ORIGINS, value: "" }
      - { key: MAX_GAS_LIMIT, value: "500000" }
      - { key: LOW_BALANCE_WBT, value: "0.01" }
      - { key: PENDING_RETRY_SECONDS, value: "30" }
      - { key: MAX_REPLACEMENTS, value: "3" }
